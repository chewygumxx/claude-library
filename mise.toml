#
#
# ~chewygumxx/claude-library.git
# ::: :/mise.toml
#
#

#
# https://mise.jdx.dev/configuration.html
#
# The development toolchain for this repository, in one place.
#
# Everything the repository runs that Bun does not install lives here, so
# a checkout never depends on whatever the contributor happens to have on
# `PATH`. Packages (commitlint, Biome, remark, prettier, husky, TypeScript)
# are pinned in `package.json` and installed by Bun instead; together the
# two files are the whole dependency surface. CI installs from this file via
# `jdx/mise-action`, so the versions below are the ones CI runs.
#
# Backends are named explicitly rather than relying on the registry alias,
# so the resolution is visible here and cannot change underneath the pin.
#

min_version = "2026.9.0"

[tools]
#
# Runtimes
#
bun = "1.4"

#
# Utilities
#
# `jq` parses tool payloads and writes hook output in the plugin hooks, and
# edits local settings in the `repo-memory` plugin hook.
#
"aqua:jqlang/jq" = "1"

#
# Shell
#
# The plugin hooks and git hooks are shell scripts. shellcheck reads
# `.shellcheckrc`; shfmt has no file of its own and reads `.editorconfig`.
#
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh"            = "3.14.1"

#
# YAML
#
# yamllint is a Python tool, installed with the uv pinned beside it. Its
# rules come from `@chewygumxx/yamllint-config` in `package.json`; prettier,
# which formats YAML, is a package pinned there too.
#
"aqua:astral-sh/uv" = "0.12.19"
"pypi:yamllint"     = "1.38.0"

[tasks."lint:plugins"]
#
# `claude plugin validate` checks each manifest along with the hooks, skills
# and agents it ships. The CLI is a tool of this task alone rather than of
# `[tools]`, so mise does not put it ahead of the contributor's own `claude`
# on `PATH` in this directory. A report is printed only when it fails.
#
description = "Validate the marketplace, every plugin and .claude"
tools       = { "aqua:anthropics/claude-code" = "2" }
run         = """
for target in . .claude plugins/*/; do
    report=$(claude plugin validate --strict "$target") || {
        printf '%s\n' "$report" >&2
        exit 1
    }
done
"""
